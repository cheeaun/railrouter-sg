name: Update GTFS train schedule

on:
  schedule:
    # Twice a month, roughly every two weeks (03:00 UTC).
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and build the GTFS schedule
        run: node scripts/download-gtfs.mjs
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gtfs-trains.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GTFS train schedule"
            git push
          fi
